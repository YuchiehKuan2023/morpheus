[project]
name = "morpheus-dfp"
version = "0.1.0"
description = "Digital Fingerprinting Pipeline"
authors = [
    {name = "Tomasz Zabek",email = "tzabek@deloitte.co.uk"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "scipy>=1.10.0,<1.12.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "torch>=2.8.0,<3.0.0",
    "torchvision>=0.23.0,<1.0.0",
    "torchaudio>=2.8.0,<3.0.0",
    "onnxruntime>=1.19.0,<2.0.0",
    "onnx>=1.17.0,<2.0.0",
    "optuna>=3.4.0,<5.0.0",
    "shap>=0.44.0,<1.0.0",
    "kafka-python>=2.0.2",
    "confluent-kafka[avro]>=2.2.0",
    "avro-python3>=1.10.2,<1.11.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "mlflow>=2.7.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.65.0",
    "colorlog>=6.7.0",
    "structlog>=23.1.0",
    "psutil>=5.9.0",
    "dill>=0.3.6",
    "prometheus-client>=0.17.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "tabulate>=0.9.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "pytest-asyncio>=0.21.0",
    "python-dotenv>=1.0.0",
    "faker>=19.3.0",
    "cryptography>=41.0.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.20",

    "passlib[bcrypt]==1.7.4",
    "poetry>=2.2.0",
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "linkify-it-py>=2.0.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
