anomaly_distribution:
  percentage_users_with_anomalies: 0.35
  anomaly_types:
    impossible_travel:
      probability: 0.25
      description: Access from geographically distant location in impossible timeframe
      severity: high
      applies_to: all
    off_hours_access:
      probability: 0.2
      description: Access outside trained work hours (per user baseline)
      severity: medium
      applies_to:
      - users without late-night work pattern
    unusual_application:
      probability: 0.15
      description: Access to application never seen during training
      severity: medium
      applies_to: all
    excessive_activity:
      probability: 0.2
      description: Activity count > 2x user's typical maximum
      severity: medium
      applies_to: all
    privilege_escalation:
      probability: 0.1
      description: Non-privileged user accessing admin resources
      severity: critical
      applies_to:
      - users without privileged_access
    unusual_device:
      probability: 0.1
      description: Access from browser/OS never seen in training
      severity: low
      applies_to: all
      malicious: false
