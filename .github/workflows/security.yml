name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security scans weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true # Don't fail workflow if CodeQL isn't available
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        continue-on-error: true
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        continue-on-error: true
        with:
          category: "/language:${{matrix.language}}"

  dependency-check:
    name: Dependency Vulnerability Scan - ${{ matrix.use-case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-case: ["dfp-poc", "dfp-demo"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Check for vulnerable dependencies
        run: |
          pip install -e ".[dev]"
          safety check --json --output safety-report.json || true
          safety check --continue-on-error
        working-directory: ${{ matrix.use-case }}

      - name: Upload safety report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safety-report-${{ matrix.use-case }}
          path: ${{ matrix.use-case }}/logs/safety-report.json

  bandit-scan:
    name: Bandit Security Scan - ${{ matrix.use-case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-case: ["dfp-poc", "dfp-demo"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit
        continue-on-error: true
        run: |
          bandit -r modules/ pipelines/ scripts/ \
            -f json -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium
          bandit -r modules/ pipelines/ scripts/ \
            --severity-level medium \
            --confidence-level medium
        working-directory: ${{ matrix.use-case }}

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report-${{ matrix.use-case }}
          path: ${{ matrix.use-case }}/logs/bandit-report.json

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
