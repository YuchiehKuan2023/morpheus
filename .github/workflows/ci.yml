name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test ${{ matrix.use-case }} - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        use-case: ["dfp-poc", "dfp-demo"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: ${{ matrix.use-case }}

      - name: Run tests with coverage
        shell: bash
        run: |
          pytest tests/ \
            --cov=modules \
            --cov=pipelines \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=html \
            -v
        working-directory: ${{ matrix.use-case }}

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./${{ matrix.use-case }}/coverage.xml
          flags: unittests-${{ matrix.use-case }}
          name: codecov-${{ matrix.use-case }}
          fail_ci_if_error: false

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.use-case }}
          path: ${{ matrix.use-case }}/htmlcov/

  lint:
    name: Code Quality Checks - ${{ matrix.use-case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-case: ["dfp-poc", "dfp-demo"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Check code formatting with Ruff
        run: |
          ruff format --check --diff .
        working-directory: ${{ matrix.use-case }}

      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github
        working-directory: ${{ matrix.use-case }}

      - name: Type check with mypy
        continue-on-error: true
        run: |
          mypy modules/ pipelines/ scripts/ --ignore-missing-imports --no-strict-optional
        working-directory: ${{ matrix.use-case }}

  security:
    name: Security Scanning - ${{ matrix.use-case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-case: ["dfp-poc", "dfp-demo"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety

      - name: Run Bandit security scan
        continue-on-error: true
        run: |
          bandit -r modules/ pipelines/ scripts/ -c .bandit -f json -o bandit-report.json
          bandit -r modules/ pipelines/ scripts/ -c .bandit -ll
        working-directory: ${{ matrix.use-case }}

      - name: Check dependencies for known vulnerabilities
        continue-on-error: true
        run: |
          cd ${{ matrix.use-case }}
          pip install -e ".[dev]"
          safety check --json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ matrix.use-case }}
          path: ${{ matrix.use-case }}/bandit-report.json

  frontend-checks:
    name: Frontend Code Quality - dfp-demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dfp-demo/frontend/ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dfp-demo/frontend/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check

      - name: TypeScript type check
        run: npm run build

  build:
    name: Build Package - ${{ matrix.use-case }}
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      fail-fast: false
      matrix:
        use-case: ["dfp-poc", "dfp-demo"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build
        working-directory: ${{ matrix.use-case }}

      - name: Check package
        run: |
          twine check dist/*
        working-directory: ${{ matrix.use-case }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages-${{ matrix.use-case }}
          path: ${{ matrix.use-case }}/dist/
